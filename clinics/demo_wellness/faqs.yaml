faqs:
  - id: "parking"
    keywords: ["חניה", "לחנות", "לחנות מכונית", "איפה להחנות"]
    question_he: "האם יש חניה?"
    answer_he: "יש חניה חינמית ממש מול הקליניקה ברחוב הרצל 12. כמו כן, ניתן לחנות ברחובות הסמוכים ללא תשלום."

  - id: "location"
    keywords: ["כתובת", "איפה", "מיקום", "איך מגיעים"]
    question_he: "מה הכתובת שלכם?"
    answer_he: "אנחנו ממוקמים ברחוב הרצל 12, תל אביב. בצמוד לתחנת האוטובוס המרכזית. קל להגיע בתחבורה ציבורית."

  - id: "price"
    keywords: ["מחיר", "עלות", "כמה עולה", "תשלום", "עלויות"]
    question_he: "מה המחיר לטיפולים?"
    answer_he: "המחירים שלנו:\n• עיסוי (60 דק') – 250 ₪\n• רפלקסולוגיה (45 דק') – 220 ₪\n• דיקור סיני (60 דק') – 280 ₪\n• טיפול פנים (60 דק') – 240 ₪\nמחזיקי כרטיס מנוי נהנים מ-15% הנחה!"

  - id: "hours"
    keywords: ["שעות", "פתוח", "סגור", "מתי פתוח", "שעות פתיחה"]
    question_he: "מה שעות הפתיחה?"
    answer_he: "שעות הפעילות שלנו:\nראשון-רביעי: 09:00–18:00\nחמישי: 09:00–20:00\nשישי: 09:00–14:00\nשבת: סגור"

  - id: "cancellation"
    keywords: ["ביטול", "לבטל", "מדיניות ביטול", "ביטול תור"]
    question_he: "מה מדיניות הביטול?"
    answer_he: "ניתן לבטל תור עד 24 שעות לפני מבלי לשלם. ביטול פחות מ-24 שעות לפני מחויב ב-50% מעלות הטיפול."

  - id: "payment"
    keywords: ["תשלום", "אשראי", "מזומן", "ביט", "פייבוקס", "איך לשלם"]
    question_he: "אילו אמצעי תשלום מקבלים?"
    answer_he: "אנחנו מקבלים: מזומן, כרטיסי אשראי, ביט ופייבוקס. תשלום נוח ומהיר!"

  - id: "covid"
    keywords: ["קורונה", "היגיינה", "בטיחות", "בריאות", "מסכה"]
    question_he: "מה פרוטוקול הבריאות שלכם?"
    answer_he: "אנחנו שומרים על סטנדרטים גבוהים של היגיינה. כל הציוד מחוטא לפני כל טיפול, המטפלים שלנו בריאים ומחוסנים. הקליניקה מאוורת היטב."

  - id: "first_visit"
    keywords: ["ביקור ראשון", "פעם ראשונה", "מה להביא", "הכנה"]
    question_he: "מה צריך לדעת לפני הביקור הראשון?"
    answer_he: "לביקור הראשון מומלץ להגיע 5 דקות לפני הטיפול. אין צורך להביא שום דבר מיוחד – אנחנו מספקים את כל הציוד. לובשים בגדים נוחים."

  - id: "gift"
    keywords: ["מתנה", "כרטיס מתנה", "וואוצ'ר", "מתנות"]
    question_he: "האם אתם מוכרים כרטיסי מתנה?"
    answer_he: "כן! אנחנו מציעים כרטיסי מתנה בכל הסכומים. כרטיסי מתנה זמינים ברכישה בקליניקה או בהזמנה טלפונית. מתנה מושלמת לאהובים!"
