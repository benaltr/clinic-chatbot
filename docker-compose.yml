services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: clinicuser
      POSTGRES_PASSWORD: clinicpass
      POSTGRES_DB: clinic_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinicuser -d clinic_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./clinics:/app/clinics:ro
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

volumes:
  postgres_data:
